name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest

    steps:
      - name: Keep Campbell County PSW Database Active
        run: |
          curl --fail --silent --show-error \
          "https://miixtftcwhloysjbmcs.supabase.co/rest/v1/members?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
