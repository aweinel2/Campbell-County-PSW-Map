<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Campbell County Police Social Work Map</title>

  <!-- Leaflet Map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #17365d;
      color: white;
      padding: 22px 30px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 105px);
      min-height: 600px;
    }

    .psw-popup h3 {
      margin: 0 0 8px;
      color: #17365d;
    }

    .psw-popup p {
      margin: 4px 0;
    }
  </style>
</head>

<body>

  <header>
    <h1>Police Social Workers in Campbell County Ky</h1>
    <p>Police Social Work services throughout Campbell County, Kentucky</p>
  </header>
<div style="text-align:center; padding:12px; background:#f4f6f8;">
  <button id="addMemberBtn" type="button">+ Add Member</button>
</div>
  <div id="memberForm" style="display:none; padding:20px; background:white; max-width:600px; margin:20px auto; border:1px solid #ccc; border-radius:8px;">
  <h2>Add Your Information</h2>

  <label>Name</label><br>
  <input type="text" id="memberName" style="width:100%; margin-bottom:10px;"><br>

  <label>Police Department</label><br>
  <input type="text" id="memberDepartment" style="width:100%; margin-bottom:10px;"><br>

  <label>Job Title</label><br>
  <input type="text" id="memberJobTitle" style="width:100%; margin-bottom:10px;"><br>

  <label>Department Address</label><br>
  <input type="text" id="memberAddress" style="width:100%; margin-bottom:10px;"><br>

  <label>City</label><br>
  <input type="text" id="memberCity" style="width:100%; margin-bottom:10px;"><br>

  <label>ZIP Code</label><br>
  <input type="text" id="memberZip" style="width:100%; margin-bottom:10px;"><br>

  <label>Email</label><br>
  <input type="email" id="memberEmail" style="width:100%; margin-bottom:10px;"><br>

  <label>Phone</label><br>
  <input type="tel" id="memberPhone" style="width:100%; margin-bottom:10px;"><br>

  <label>Short Bio</label><br>
  <textarea id="memberBio" style="width:100%; margin-bottom:10px;"></textarea><br>

  <label>Photo</label><br>
  <input type="file" id="memberPhoto" accept="image/*" style="margin-bottom:15px;"><br>

  <button id="submitMemberBtn" type="button">Submit Member</button>
  <button id="cancelMemberBtn" type="button">Cancel</button>
</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Center the map on Campbell County, Kentucky
const map = L.map('map');
    // Add the street map
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);
// Load Campbell County boundary
    // Load the official Campbell County, Kentucky boundary
fetch("https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/63/query?where=GEOID%3D%2721037%27&outFields=*&returnGeometry=true&outSR=4326&f=geojson")
  .then(response => response.json())
  .then(data => {
    const countyBoundary = L.geoJSON(data, {
      style: {
        color: "#17365d",
        weight: 4,
        fillColor: "#17365d",
        fillOpacity: 0.08
      }
    }).addTo(map);

    map.fitBounds(countyBoundary.getBounds(), {
      padding: [25, 25]
    });
  });
  </script>
  <script>
const SUPABASE_URL = 'https://miixtrftcwhloysjbmcs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lE9Eiun-m0FTM84EBZlV1A_qZ2K1DVx';


    
  document.getElementById('addMemberBtn').addEventListener('click', function () {
    document.getElementById('memberForm').style.display = 'block';
    document.getElementById('map').style.display = 'none';
  });

  document.getElementById('cancelMemberBtn').addEventListener('click', function () {
    document.getElementById('memberForm').style.display = 'none';
    document.getElementById('map').style.display = 'block';
    map.invalidateSize();
  });

  document.getElementById('submitMemberBtn').addEventListener('click', async function () {
  const submitBtn = document.getElementById('submitMemberBtn');

  const name = document.getElementById('memberName').value.trim();
  const department = document.getElementById('memberDepartment').value.trim();
  const jobTitle = document.getElementById('memberJobTitle').value.trim();
  const address = document.getElementById('memberAddress').value.trim();
  const city = document.getElementById('memberCity').value.trim();
  const zip = document.getElementById('memberZip').value.trim();
  const email = document.getElementById('memberEmail').value.trim();
  const phone = document.getElementById('memberPhone').value.trim();
  const bio = document.getElementById('memberBio').value.trim();
  const photo = document.getElementById('memberPhoto').files[0];

  if (!name || !department || !address) {
    alert('Please enter your name, police department, and department address.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';

  try {
    let photoUrl = null;

    if (photo) {
      const safeName = photo.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const fileName = `${Date.now()}-${safeName}`;

      const uploadResponse = await fetch(
        `${SUPABASE_URL}/storage/v1/object/member-photos/${fileName}`,
        {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': photo.type
          },
          body: photo
        }
      );

      if (!uploadResponse.ok) {
        throw new Error('Photo upload failed.');
      }

      photoUrl = `${SUPABASE_URL}/storage/v1/object/public/member-photos/${fileName}`;
    }

    const memberResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/members`,
      {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({
          name: name,
          police_department: department,
          job_title: jobTitle,
          address: address,
          city: city,
          state: 'KY',
          zip_code: zip,
          email: email,
          phone: phone,
          bio: bio,
          photo_url: photoUrl,
          approved: false
        })
      }
    );

    if (!memberResponse.ok) {
      throw new Error('Member submission failed.');
    }

    alert('Thank you! Your information has been submitted for approval.');

    document.getElementById('memberForm').style.display = 'none';
    document.getElementById('map').style.display = 'block';
    map.invalidateSize();

  } catch (error) {
    console.error(error);
    alert('Something went wrong while submitting your information. Please try again.');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Member';
  }
}); 
async function geocodeAddress(member) {
  const fullAddress = [
    member.address,
    member.city,
    member.state || 'KY',
    member.zip_code
  ].filter(Boolean).join(', ');

  const response = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(fullAddress)}`
  );

  const results = await response.json();

  if (results.length === 0) {
    return null;
  }

  return {
    latitude: parseFloat(results[0].lat),
    longitude: parseFloat(results[0].lon)
  };
}

function safeText(value) {
  const div = document.createElement('div');
  div.textContent = value || '';
  return div.innerHTML;
}

async function loadApprovedMembers() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/members?approved=eq.true&select=*`,
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error('Unable to load approved members.');
    }

    const members = await response.json();

    for (const member of members) {
      let latitude = member.latitude;
      let longitude = member.longitude;

      if (!latitude || !longitude) {
        const location = await geocodeAddress(member);

        if (!location) {
          console.warn('Could not locate:', member.police_department);
          continue;
        }

        latitude = location.latitude;
        longitude = location.longitude;
      }

      const marker = L.marker([latitude, longitude]).addTo(map);

      const photoHtml = member.photo_url
        ? `<img src="${member.photo_url}" alt="${safeText(member.name)}" style="width:90px;height:90px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 10px;">`
        : '';

      const emailHtml = member.email
        ? `<p><strong>Email:</strong> <a href="mailto:${safeText(member.email)}">${safeText(member.email)}</a></p>`
        : '';

      const phoneHtml = member.phone
        ? `<p><strong>Phone:</strong> ${safeText(member.phone)}</p>`
        : '';

      const bioHtml = member.bio
        ? `<p>${safeText(member.bio)}</p>`
        : '';

      marker.bindPopup(`
        <div class="psw-popup" style="min-width:220px;">
          ${photoHtml}
          <h3>${safeText(member.name)}</h3>
          <p><strong>${safeText(member.job_title || 'Police Social Worker')}</strong></p>
          <p>${safeText(member.police_department)}</p>
          ${emailHtml}
          ${phoneHtml}
          ${bioHtml}
        </div>
      `);
    }

  } catch (error) {
    console.error('Error loading members:', error);
  }
}

loadApprovedMembers();

    
</script>

</body>
</html>
