<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Campbell County Police Social Work Map</title>

  <!-- Leaflet Map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #17365d;
      color: white;
      padding: 22px 30px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    #map {
      width: 100%;
      height: calc(100vh - 105px);
      min-height: 600px;
    }

    .psw-popup h3 {
      margin: 0 0 8px;
      color: #17365d;
    }

    .psw-popup p {
      margin: 4px 0;
    }
  </style>
</head>

<body>

  <header>
    <h1>Police Social Workers in Campbell County Ky</h1>
    <p>Police Social Work services throughout Campbell County, Kentucky</p>
  </header>
<div style="text-align:center; padding:12px; background:#f4f6f8;">
  <button id="addMemberBtn" type="button">+ Add Member</button>
</div>
  <div id="memberForm" style="display:none; padding:20px; background:white; max-width:600px; margin:20px auto; border:1px solid #ccc; border-radius:8px;">
  <h2>Add Your Information</h2>

  <label>Name</label><br>
  <input type="text" id="memberName" style="width:100%; margin-bottom:10px;"><br>

  <label>Police Department</label><br>
  <input type="text" id="memberDepartment" style="width:100%; margin-bottom:10px;"><br>

  <label>Job Title</label><br>
  <input type="text" id="memberJobTitle" style="width:100%; margin-bottom:10px;"><br>

  <label>Department Address</label><br>
  <input type="text" id="memberAddress" style="width:100%; margin-bottom:10px;"><br>

  <label>City</label><br>
  <input type="text" id="memberCity" style="width:100%; margin-bottom:10px;"><br>

  <label>ZIP Code</label><br>
  <input type="text" id="memberZip" style="width:100%; margin-bottom:10px;"><br>

  <label>Email</label><br>
  <input type="email" id="memberEmail" style="width:100%; margin-bottom:10px;"><br>

  <label>Phone</label><br>
  <input type="tel" id="memberPhone" style="width:100%; margin-bottom:10px;"><br>

  <label>Short Bio</label><br>
  <textarea id="memberBio" style="width:100%; margin-bottom:10px;"></textarea><br>

  <label>Photo</label><br>
  <input type="file" id="memberPhoto" accept="image/*" style="margin-bottom:15px;"><br>

  <button id="submitMemberBtn" type="button">Submit Member</button>
  <button id="cancelMemberBtn" type="button">Cancel</button>
</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Center the map on Campbell County, Kentucky
const map = L.map('map');
    // Add the street map
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);
// Load Campbell County boundary
    // Load the official Campbell County, Kentucky boundary
fetch("https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/63/query?where=GEOID%3D%2721037%27&outFields=*&returnGeometry=true&outSR=4326&f=geojson")
  .then(response => response.json())
  .then(data => {
    const countyBoundary = L.geoJSON(data, {
      style: {
        color: "#17365d",
        weight: 4,
        fillColor: "#17365d",
        fillOpacity: 0.08
      }
    }).addTo(map);

    map.fitBounds(countyBoundary.getBounds(), {
      padding: [25, 25]
    });
  });
  </script>
  <script>
  document.getElementById('addMemberBtn').addEventListener('click', function () {
    document.getElementById('memberForm').style.display = 'block';
    document.getElementById('map').style.display = 'none';
  });

  document.getElementById('cancelMemberBtn').addEventListener('click', function () {
    document.getElementById('memberForm').style.display = 'none';
    document.getElementById('map').style.display = 'block';
    map.invalidateSize();
  });
</script>

</body>
</html>
